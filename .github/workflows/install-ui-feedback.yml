name: Install UI Feedback Tool

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-ui-feedback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QTSC
        uses: actions/checkout@v4

      - name: Install canonical UI Feedback bundle
        run: |
          set -euo pipefail
          SOURCE_SHA="4ef8421d0dc38bdc5f0af198aab94f6943821657"
          curl -fsSL "https://raw.githubusercontent.com/Ngh1aa/ui-feedback-tool/${SOURCE_SHA}/src/ui-feedback.js" -o ui-feedback.js
          mkdir -p assets/js
          cat > assets/js/ui-feedback-init.js <<'EOF'
          (() => {
            const launcher = document.createElement('button');
            launcher.type = 'button';
            launcher.id = 'qtsc-ui-feedback-launcher';
            launcher.dataset.uiFeedbackIgnore = 'true';
            launcher.textContent = 'UI';
            launcher.title = 'Đang tải UI Feedback Tool…';
            launcher.setAttribute('aria-label', 'Bật hoặc tắt UI Feedback Tool');
            launcher.style.cssText = [
              'position:fixed',
              'left:16px',
              'bottom:16px',
              'z-index:2147483647',
              'min-width:44px',
              'height:44px',
              'padding:0 14px',
              'border:1px solid rgba(255,255,255,.18)',
              'border-radius:999px',
              'background:#111111',
              'color:#ffffff',
              'font:700 12px/1 Manrope,system-ui,sans-serif',
              'letter-spacing:.08em',
              'box-shadow:0 10px 30px rgba(0,0,0,.22)',
              'cursor:pointer',
              'opacity:.94'
            ].join(';');
            document.documentElement.appendChild(launcher);

            import('../../ui-feedback.js?v=4ef8421')
              .then(({ createUIFeedback }) => {
                if (typeof createUIFeedback !== 'function') throw new Error('createUIFeedback export not found');
                const feedback = createUIFeedback({
                  storageKey: 'qtsc-ui-feedback',
                  githubRepo: 'Ngh1aa/QTSC',
                  accent: '#EE4623',
                });
                if (!feedback) throw new Error('UI Feedback instance was not created');
                window.__qtscUIFeedback = feedback;
                launcher.title = 'UI Feedback Tool — click hoặc nhấn Q → W → E';
                launcher.addEventListener('click', () => feedback.toggle());
                console.info('[QTSC] UI Feedback Tool v0.14.0 ready');
              })
              .catch((error) => {
                console.error('[QTSC] UI Feedback Tool failed to load:', error);
                launcher.textContent = 'UI !';
                launcher.title = `UI Feedback lỗi: ${error?.message || error}`;
                launcher.style.background = '#B42318';
              });
          })();
          EOF

      - name: Load the tool on every HTML page
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          tag = '<script src="assets/js/ui-feedback-init.js?v=0.14.0-qtsc2"></script>'
          pattern = re.compile(r'<script[^>]+src=["\']assets/js/ui-feedback-init\.js[^"\']*["\'][^>]*></script>', re.I)

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if pattern.search(text):
                  text = pattern.sub(tag, text)
              elif '</body>' in text:
                  text = text.replace('</body>', f'{tag}</body>')
              else:
                  continue
              path.write_text(text, encoding='utf-8')
              print(f'Updated UI Feedback loader in {path}')
          PY

      - name: Verify integration
        run: |
          set -euo pipefail
          test -s ui-feedback.js
          test -s assets/js/ui-feedback-init.js
          grep -q "qtsc-ui-feedback-launcher" assets/js/ui-feedback-init.js
          grep -q "ui-feedback-init.js?v=0.14.0-qtsc2" index.html
          grep -q "ui-feedback-init.js?v=0.14.0-qtsc2" about.html
          grep -q "ui-feedback-init.js?v=0.14.0-qtsc2" office.html

      - name: Commit installation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-feedback.js assets/js/ui-feedback-init.js '*.html'
          if git diff --cached --quiet; then
            echo "UI Feedback is already installed."
            exit 0
          fi
          git commit -m "fix: make UI Feedback reliably available on QTSC"
          git push
