name: Sync UI Feedback Tool

on:
  repository_dispatch:
    types: [ui-feedback-updated]

permissions:
  contents: write

jobs:
  sync:
    name: Sync canonical UI Feedback file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Checkout canonical UI Feedback source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.source_repo || 'Ngh1aa/ui-feedback-tool' }}
          ref: ${{ github.event.client_payload.source_sha }}
          path: .ui-feedback-source

      - name: Copy synchronized file
        run: |
          set -euo pipefail
          cp .ui-feedback-source/src/ui-feedback.js ui-feedback.js

      - name: Commit and push synchronized file
        env:
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-feedback.js
          if git diff --cached --quiet; then
            echo "UI Feedback is already synchronized at ${SOURCE_SHA}."
            exit 0
          fi
          git commit -m "chore: sync UI Feedback tool ${SOURCE_SHA}"
          git push
